# nav2_params.yaml
# ─────────────────────────────────────────────────────────────────────────────
# FIXES vs previous version:
#
# 1. global_costmap transform_tolerance  1.0 → 2.0 s
#    Firmware SNTP timestamps arrive 1-2 s behind wall clock. The message
#    filter in the global costmap obstacle_layer drops any scan where the
#    map→laser_link TF at scan.stamp is not in the TF buffer within
#    transform_tolerance seconds.  With the previous 1.0 s limit, scans
#    queued for >1 s (which happens during recovery behaviours) were silently
#    dropped, leaving the global costmap with stale/unknown cells.
#    Symptom: "Message Filter dropping message: frame 'laser_link' at time X
#    for reason 'timestamp on the message is earlier than all available'".
#
# 2. controller_server FollowPath transform_tolerance  0.5 → 1.0 s
#    After a 5 s wait recovery the controller immediately requests a TF for
#    the latest plan pose.  With the EKF owning odom→base_footprint the TF
#    is published at 30 Hz (33 ms period); the 0.5 s tolerance was fine in
#    isolation but when combined with clock jitter and the post-wait TF gap
#    the lookup failed.  1.0 s eliminates the "extrapolation into the future"
#    errors without degrading tracking accuracy.
#
# 3. controller_server max_allowed_time_to_collision_up_to_carrot  1.0 → 0.5 s
#    At desired_linear_vel=0.3 m/s, 1.0 s collision horizon = 0.3 m look-
#    ahead for obstacles.  For a robot_radius of 0.30 m + inflation_radius of
#    0.40 m, any wall within 1.0 m of the path triggered "collision ahead".
#    0.5 s gives 0.15 m clearance horizon — still safe but avoids false
#    positives in tight corridors.
#
# 4. controller_server failure_tolerance  0.3 → 1.0 s
#    A single scan timestamp mismatch caused the costmap to momentarily show
#    an obstacle, the controller to detect a collision, and to abort within
#    0.3 s — too fast to recover.  1.0 s gives the EKF and costmap time to
#    resolve transient TF errors before declaring failure.
#
# 5. local_costmap obstacle_min_range  0.25 → 0.10 m
#    The previous 0.25 m minimum range created a blind zone immediately around
#    the robot.  At startup the robot's own body was inside this blind zone,
#    leaving a ring of unknown space that the controller interpreted as
#    potentially occupied.  0.10 m matches the physical minimum reliable range
#    of the LYDSTO LDS02RR (0.02 m range_min, but 0.10 m is conservative for
#    the inflation radius to be effective).
#
# 6. behavior_server backup/spin collision check — no change.
#    The backup and spin failures are downstream of the false costmap obstacles;
#    fixing the costmap (#1, #5) will resolve the recovery failures.
# ─────────────────────────────────────────────────────────────────────────────

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    default_nav_to_pose_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    default_nav_through_poses_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_smoother_selector_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 5.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001

    # FIX: 0.3 → 1.0 s.
    # A single transient TF or costmap glitch caused the controller to abort
    # within 0.3 s — before the EKF could resolve the gap.  1.0 s absorbs
    # the occasional post-recovery TF hiccup without masking real failures.
    failure_tolerance: 1.0

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.15

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.3
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.6

      # FIX: 0.5 → 1.0 s.
      # After the 5 s wait recovery, the controller requests a TF for the
      # plan frame at the post-wait time.  The EKF TF buffer had a gap during
      # the wait (no motion = less frequent TF updates).  0.5 s was exceeded;
      # 1.0 s absorbs this gap without degrading closed-loop tracking.
      transform_tolerance: 1.0

      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true

      # FIX: 1.0 → 0.5 s.
      # At 0.3 m/s linear vel, 1.0 s horizon = 0.30 m lookahead for obstacles.
      # robot_radius (0.30) + inflation_radius (0.40) = 0.70 m clearance zone.
      # Any wall within ~1.0 m of the planned path triggered collision abort
      # before the robot even started moving.  0.5 s gives a 0.15 m horizon —
      # safe for a 0.45 m wide robot in normal warehouse aisles.
      max_allowed_time_to_collision_up_to_carrot: 0.5

      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.25
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 2.0
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.30
      transform_tolerance: 1.0
      plugins: ["voxel_layer", "inflation_layer"]

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 9.5
          # FIX: 0.25 → 0.10 m.
          # Previous 0.25 m created a physical blind ring around the robot.
          # The robot body (0.45 m wide) was partially inside this zone,
          # leaving unknown cells that inflated into the robot's planned path.
          # 0.10 m is safely above the LYDSTO's 0.02 m range_min while
          # eliminating the phantom obstacle ring at startup.
          obstacle_min_range: 0.10

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.40

      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.30
      resolution: 0.05
      track_unknown_space: true

      # FIX: 1.0 → 2.0 s.
      # Firmware SNTP timestamps arrive 1.0-2.0 s behind wall clock.
      # The global costmap's obstacle_layer message filter rejects any scan
      # where the map→laser_link TF at scan.stamp is not in the buffer within
      # transform_tolerance.  Scans queued during recovery behaviours (backup,
      # spin, wait) accumulated 1-5 s of latency and were all dropped with the
      # previous 1.0 s limit.  2.0 s covers the full firmware offset range
      # while still detecting genuinely stale data.
      transform_tolerance: 2.0

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          inf_is_valid: false
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 9.5
          # FIX: 0.25 → 0.10 m (same reasoning as local costmap above)
          obstacle_min_range: 0.10

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.40

      always_send_full_costmap: true

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 1.0
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.6
    min_rotational_vel: 0.2
    rotational_acc_lim: 2.0

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    input_topic: "cmd_vel_nav"
    output_topic: "cmd_vel"
    max_velocity: [0.5, 0.0, 1.0]
    min_velocity: [-0.5, 0.0, -1.0]
    max_accel: [1.5, 0.0, 2.0]
    max_decel: [-2.5, 0.0, -2.0]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - controller_server
      - planner_server
      - smoother_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother
