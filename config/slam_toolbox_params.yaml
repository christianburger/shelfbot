# slam_toolbox_params.yaml
# ─────────────────────────────────────────────────────────────────────────────
# FIXES applied vs previous version:
#
# 1. minimum_time_interval  0.50 → 0.25 s  (4 scan processings/s instead of 2)
#    With sparse environments (59 % inf rays), more attempts = better map.
#
# 2. minimum_laser_range  0.05 → 0.02 m
#    LYDSTO LDS02RR range_min = 0.02 m (confirmed by integration test).
#    Previous value 0.05 discarded valid near-field returns.
#
# 3. map_update_interval: 1.0 s  (was absent, defaulted to ~5 s)
#    The global costmap static_layer subscribes at Nav2 start (T+20 s).
#    With 1 s updates slam gets 12 complete map publications before
#    static_layer first subscribes.  With the old default only 2-3.
#
# 4. loop_match_minimum_response_coarse  0.35 → 0.20
#    loop_match_minimum_response_fine    0.45 → 0.30
#    Open warehouse / sparse scan environments produce lower matcher scores.
#    Tightening the gate caused slam to reject most scans while still
#    publishing the map→odom TF from odometry  →  map grew in bounds but
#    all cells remained -1.  Lower thresholds allow cell insertion to proceed.
#
# 5. transform_timeout  1.0 → 0.5 s
#    controller update_rate is now 4 Hz (250 ms TF period).
#    At scan.stamp = now-600 ms, the nearest TF entry is at most 125 ms away.
#    0.5 s timeout provides 4× headroom without the 1 s wait penalty.
#
# TF chain slam_toolbox needs (all must be live before scan processing):
#   odom → base_footprint  (hardware interface, 4 Hz)
#   base_footprint → base_link   (URDF static)
#   base_link → laser_link       (URDF static)
# ─────────────────────────────────────────────────────────────────────────────

slam_toolbox:
  ros__parameters:
    scan_queue_size: 50
    # ── Solver ────────────────────────────────────────────────────────────────
    solver_plugin:          solver_plugins::CeresSolver
    ceres_linear_solver:    SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner:   SCHUR_JACOBI
    ceres_trust_strategy:   LEVENBERG_MARQUARDT
    ceres_dogleg_type:      TRADITIONAL_DOGLEG
    ceres_loss_function:    None

    # ── TF frames ─────────────────────────────────────────────────────────────
    odom_frame:  odom
    map_frame:   map
    base_frame:  base_footprint
    scan_topic:  /scan
    mode:        mapping

    # ── Scan matching ──────────────────────────────────────────────────────────
    use_scan_matching:   true
    use_scan_barycenter: true

    # ── Motion / time thresholds ──────────────────────────────────────────────
    # minimum_travel_distance/heading = 0.0  →  process first scan unconditionally
    # (slam_toolbox will not publish map→odom until it processes at least one scan,
    #  so these must be 0.0 to establish the map frame immediately at startup)
    minimum_travel_distance: 0.0
    minimum_travel_heading:  0.0

    # FIX: 0.50 → 0.25  (was limiting to 2 scan processings/sec in sparse env)
    minimum_time_interval:   0.25

    # FIX: was absent (default ~5 s); 1 s ensures ≥12 /map publications
    # before Nav2 static_layer first subscribes at T+20 s.
    map_update_interval:     1.0

    # ── TF timing ─────────────────────────────────────────────────────────────
    # FIX: 1.0 → 0.5 s.  controller_manager now runs at 4 Hz (250 ms period).
    # Worst-case gap at scan.stamp (now-600 ms) = 125 ms  ≪  500 ms timeout.
    transform_timeout:    2.0
    tf_buffer_duration:   60.0

    # ── Laser range limits ────────────────────────────────────────────────────
    # FIX: minimum_laser_range 0.05 → 0.02  (sensor range_min = 0.02 m)
    max_laser_range:     10.0
    minimum_laser_range: 0.02

    # ── Map resolution ────────────────────────────────────────────────────────
    resolution: 0.05   # 5 cm/cell

    # ── Loop closure ──────────────────────────────────────────────────────────
    do_loop_closing:          true
    loop_search_distance:     5.0
    loop_search_maximum_distance: 3.0

    # FIX: 0.35 → 0.20  (sparse/open environments score ~0.20-0.25 on first scans)
    loop_match_minimum_response_coarse: 0.20

    # FIX: 0.45 → 0.30  (same reason — prevents slam dropping all scans)
    loop_match_minimum_response_fine:   0.30

    loop_match_maximum_variance_coarse: 3.0

    # ── Message filter ────────────────────────────────────────────────────────
    throttle_scans: 1   # process every scan that passes the time gate

    # ── Pose graph memory ─────────────────────────────────────────────────────
    stack_size_to_use: 40000000   # 40 MB

    # ── Interactive / save mode ───────────────────────────────────────────────
    enable_interactive_mode: true
